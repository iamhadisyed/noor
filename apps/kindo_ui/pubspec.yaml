name: kindo_ui
description: "Shared look and building blocks for the Kindo Parent and Kindo Junior apps: theme, session, sign-in, pictures and sounds, spelling keyboard, tracing canvas."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.7
  flutter: ">=1.17.0"

dependencies:
  audioplayers: ^6.8.1
  file_picker: ^13.3.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  kindo_core:
    path: ../kindo_core
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  record: ^7.1.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    # Urdu text: Noto Naskh Arabic (SIL OFL, licence in assets/fonts). Flutter shapes and orders Arabic script itself.
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic_400Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic_700Bold.ttf
          weight: 700
